# 临时诊断（用完即删）：验证仓库 secret NPM_TOKEN 能在 Actions 中生效
name: npm-token-check
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify NPM_TOKEN secret
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then echo "❌ secret 为空"; exit 1; fi
          echo "secret 长度: ${#TOKEN}"
          npm whoami --//registry.npmjs.org/:_authToken="${{ secrets.NPM_TOKEN }}" \
            && echo "✅ 凭据可用（上方为 npm 账号名）" \
            || { echo "❌ 凭据不可用"; exit 1; }
        env:
          TOKEN: ${{ secrets.NPM_TOKEN }}
