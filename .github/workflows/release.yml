# 打 tag（v*.*.*）时自动生成 Release Notes 并校验构建
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}   # 支持手动重跑（如：发布环节补跑，无需重打 tag）

permissions:
  contents: write
  id-token: write          # npm Trusted Publishing（OIDC）：无需 token/OTP

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install root dependencies
        run: npm ci

      - name: Type check (frontend)
        run: npx tsc --noEmit

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Type check (server)
        working-directory: server
        run: npx tsc --noEmit

      - name: Start backend (for integration tests)
        working-directory: server
        run: |
          npx tsx src/index.ts > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3018/api/health > /dev/null 2>&1; then
              echo "backend ready"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:3018/api/health || (echo "backend failed to start"; cat /tmp/backend.log; exit 1)

      - name: Run tests
        run: npx vitest run
      - name: Package content guard（硬门槛：不得含运行时数据/密钥）
        run: node scripts/check-package.mjs

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Upgrade npm (Trusted Publishing 需 npm >= 11.5.1)
        run: npm install -g npm@latest

      # npm Trusted Publishing：凭 GitHub OIDC 直接发布，免 token/免 2FA 动态码，并自动附 provenance 签名
      # 前置（npm 网站一次性配置）：包 guanwei → Settings → Trusted Publisher → GitHub Actions
      #   Organization: RubyCcll   Repository: guanwei   Workflow: release.yml
      - name: Publish to npm (OIDC)
        run: npm publish --access public --provenance

