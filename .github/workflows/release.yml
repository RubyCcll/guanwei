# 打 tag（v*.*.*）时自动生成 Release Notes 并校验构建
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}   # 支持手动重跑（如：发布环节补跑，无需重打 tag）

permissions:
  contents: write
  id-token: write          # npm Trusted Publishing（OIDC）：无需 token/OTP

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install root dependencies
        run: npm ci

      - name: Type check (frontend)
        run: npx tsc --noEmit

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Type check (server)
        working-directory: server
        run: npx tsc --noEmit

      - name: Start backend (for integration tests)
        working-directory: server
        run: |
          npx tsx src/index.ts > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3018/api/health > /dev/null 2>&1; then
              echo "backend ready"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:3018/api/health || (echo "backend failed to start"; cat /tmp/backend.log; exit 1)

      - name: Run tests
        run: npx vitest run
      - name: Package content guard（硬门槛：不得含运行时数据/密钥）
        run: node scripts/check-package.mjs

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Upgrade npm (Trusted Publishing 需 npm >= 11.5.1)
        run: npm install -g npm@latest

      # npm Trusted Publishing：凭 GitHub OIDC 直接发布，免 token/免 2FA 动态码，并自动附 provenance 签名
      # 前置（npm 网站一次性配置，**尚未配置时本步骤会 ENEEDAUTH 失败**）：包 guanwei → Settings →
      #   Trusted Publisher → GitHub Actions：Organization `RubyCcll` / Repository `guanwei` / Workflow `release.yml`
      # 未配置期间改用本地 Automation token 发布：`node scripts/npm-release.mjs`（见 internal/docs/RELEASE-SOP.md）
      # 幂等：版本已在 registry 上则跳过（重跑工作流不会因「版本已存在」失败）
      # 双通道：首选 OIDC（Trusted Publisher，附 provenance 签名）；未配置时回退仓库 secret `NPM_TOKEN`
      # （Automation token，与本地 scripts/npm-release.mjs 同一枚；token 路径无 provenance）
      - name: Publish to npm（OIDC 优先，回退 NPM_TOKEN；已发布则跳过）
        run: |
          set -euo pipefail
          VER=$(node -p "require('./package.json').version")
          if npm view "guanwei@$VER" version >/dev/null 2>&1; then
            echo "guanwei@$VER 已存在于 registry，跳过发布（幂等）"
            exit 0
          fi
          # 回退通道自检（只验凭据，不发布；token 由 Actions 自动打码）
          npm whoami --//registry.npmjs.org/:_authToken="${{ secrets.NPM_TOKEN }}" \
            && echo "✅ NPM_TOKEN 可用（回退通道就绪）" \
            || echo "⚠️ NPM_TOKEN 不可用（secret 缺失或已撤销）"
          if npm publish --access public --provenance; then
            echo "✅ 经 Trusted Publisher(OIDC) 发布，已附 provenance"
            exit 0
          fi
          echo "⚠️ OIDC 发布未成功（Trusted Publisher 未配置？）→ 回退 NPM_TOKEN 发布"
          npm publish --access public --//registry.npmjs.org/:_authToken="${{ secrets.NPM_TOKEN }}"

