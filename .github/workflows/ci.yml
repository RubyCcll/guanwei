name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai   # 历法引擎按北京钟表语义，避免 runner UTC 时区导致月将/节气判定漂移
      SWE_PYTHON: python3 # 星历对照测试用系统 python（已装 pyswisseph）
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Python (Swiss Ephemeris 对照测试)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pyswisseph (星历/节气交叉验证)
        run: python3 -m pip install --quiet pyswisseph
        env:
          SWE_PYTHON: python3

      - name: Install root dependencies
        run: npm ci

      - name: Type check (frontend)
        run: npx tsc --noEmit

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Type check (server)
        working-directory: server
        run: npx tsc --noEmit

      - name: Start backend (for integration tests)
        working-directory: server
        run: |
          npx tsx src/index.ts > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          # 等待就绪
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3018/api/health > /dev/null 2>&1; then
              echo "backend ready"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:3018/api/health || (echo "backend failed to start"; cat /tmp/backend.log; exit 1)

      - name: Run tests
        run: npx vitest run

      - name: Kill backend
        run: |
          kill $(cat /tmp/backend.pid) 2>/dev/null || true

      - name: Package content guard（硬门槛：不得含运行时数据/密钥）
        run: node scripts/check-package.mjs

      - name: Build frontend
        run: npm run build

      - name: Server smoke (divineStore)
        working-directory: server
        run: npx tsx scripts/divineStoreSmoke.ts