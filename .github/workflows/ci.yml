name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Type check (frontend)
        run: npx tsc --noEmit

      - name: Run tests
        run: npx vitest run

      - name: Build frontend
        run: npm run build

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Type check (server)
        working-directory: server
        run: npx tsc --noEmit

      - name: Server smoke (divineStore)
        working-directory: server
        run: npx tsx scripts/divineStoreSmoke.ts
