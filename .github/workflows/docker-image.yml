# 构建并推送 Docker 镜像到 GitHub Container Registry（GHCR），并自动设为公开
# 触发：推送 v* tag（Release 版）与 main（latest）
# 使用：docker pull ghcr.io/rubyccll/guanwei-web:latest
name: docker-image

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: guanwei
            file: Dockerfile.all
            imgname: guanwei
          - image: guanwei-backend
            file: Dockerfile.server
            imgname: guanwei-guanwei-backend
          - image: guanwei-web
            file: Dockerfile.web
            imgname: guanwei-guanwei-web
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.imgname }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=,format=short,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 注：包可见性无法由 GITHUB_TOKEN 修改（GitHub 平台限制），
      # 首次发布后需手动在 Profile → Packages → 包设置 → Change visibility 设为 Public

  # 容器端到端冒烟：镜像「能构建」不等于「能跑」——起容器 → 健康检查 → 起占 → 校验落库到挂载卷。
  # 覆盖点：node:22-alpine 上 node:sqlite 可用、/app/data 卷可写、统一 SQLite（WAL）在建卷后正常落盘。
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # buildx 需从 Docker Hub 拉 buildkit 镜像，偶发网络重置（实测 connection reset by peer）
      # → 失败不终止，下一步重试一次；仍失败则如实失败
      - name: Set up Docker Buildx
        id: buildx
        continue-on-error: true
        uses: docker/setup-buildx-action@v3

      - name: Retry Docker Buildx（拉取失败时）
        if: steps.buildx.outcome == 'failure'
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (load into daemon)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          platforms: linux/amd64
          load: true
          tags: guanwei-backend:smoke
          cache-from: type=gha,scope=smoke
          cache-to: type=gha,mode=max,scope=smoke

      - name: Run container and verify storage + API
        run: |
          set -euo pipefail
          docker volume create gw-smoke-data
          docker run -d --name gw-smoke -p 127.0.0.1:3300:3018 -v gw-smoke-data:/app/data guanwei-backend:smoke
          ok=""
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3300/api/health -o /tmp/health.json; then ok=1; break; fi
            sleep 2
          done
          test -n "$ok" || { echo "容器未就绪"; docker logs gw-smoke; exit 1; }
          echo "health: $(cat /tmp/health.json)"
          grep -q '"store":"sqlite"' /tmp/health.json
          grep -q '"users":0' /tmp/health.json
          # 起占（匿名本机来源）→ 自动建档 + 落库 + 下发 claimToken
          code=$(curl -s -o /tmp/divine.json -w '%{http_code}' -X POST http://127.0.0.1:3300/api/divine \
            -H 'Content-Type: application/json' -d '{"username":"容器冒烟","artId":"liuyao","inputs":{}}')
          test "$code" = "200" || { echo "起占失败 HTTP $code"; cat /tmp/divine.json; docker logs gw-smoke; exit 1; }
          grep -q '"claimToken"' /tmp/divine.json
          curl -fsS http://127.0.0.1:3300/api/health | tee /tmp/health2.json
          grep -q '"users":1' /tmp/health2.json
          # 数据必须落在挂载卷里的统一库（不是镜像层内的临时目录）
          docker exec gw-smoke sh -c 'ls -l /app/data'
          docker exec gw-smoke sh -c 'test -f /app/data/guanwei.db'
          docker exec gw-smoke sh -c 'test ! -f /app/data/db.json'
          docker logs gw-smoke | tail -20
          docker rm -f gw-smoke
