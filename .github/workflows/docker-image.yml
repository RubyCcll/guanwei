# 构建并推送 Docker 镜像到 GitHub Container Registry（GHCR），并自动设为公开
# 触发：推送 v* tag（Release 版）与 main（latest）
# 使用：docker pull ghcr.io/rubyccll/guanwei-web:latest
name: docker-image

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: guanwei-backend
            file: Dockerfile.server
          - image: guanwei-web
            file: Dockerfile.web
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=,format=short,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ensure package is public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          base="guanwei-${{ matrix.image }}"
          ok=""
          for n in "$base" "${{ github.repository_owner }}-$base"; do
            if gh api "user/packages/container/$n" >/dev/null 2>&1; then
              gh api --method POST "user/packages/container/$n/visibility" -f visibility=public >/dev/null 2>&1 && { echo "public: $n"; ok=1; break; }
            fi
          done
          [ -n "$ok" ] || echo "manual-set-needed: $base"
