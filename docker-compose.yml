# 观微一键部署：docker compose up -d
# 首次使用：先填好 server/.env（API Key），或直接运行 ./scripts/setup.sh --docker --key sk-xxx
name: guanwei
services:
  backend:
    image: ghcr.io/rubyccll/guanwei-backend:latest
    build:            # 本地构建备用：docker compose build --no-cache
      context: .
      dockerfile: Dockerfile.server
    env_file:
      - server/.env
    ports:
      - "${API_PORT:-3018}:3018"
    volumes:
      - guanwei-data:/app/server/src/data
    restart: unless-stopped

  web:
    image: ghcr.io/rubyccll/guanwei-web:latest
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  guanwei-data:
